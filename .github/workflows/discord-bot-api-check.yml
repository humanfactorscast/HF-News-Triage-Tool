name: One-time Discord bot API check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read bot identity once
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.HFC_DISCORD_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "")
          if not token:
              print("HFC_DISCORD_BOT_TOKEN secret is missing")
              sys.exit(2)

          request = urllib.request.Request(
              "https://discord.com/api/v10/users/@me",
              headers={
                  "Authorization": "Bot " + token,
                  "User-Agent": "DiscordBot (https://www.humanfactorscast.media, 1.0)",
                  "Accept": "application/json",
              },
              method="GET",
          )
          try:
              response = urllib.request.urlopen(request, timeout=15)
          except urllib.error.HTTPError as error:
              response = error
          except Exception as error:
              print(json.dumps({"transport_error": type(error).__name__}))
              sys.exit(1)

          with response:
              status = response.status
              headers = response.headers
              body = response.read(4096)
          try:
              payload = json.loads(body)
          except (ValueError, UnicodeDecodeError):
              payload = {}
          print(json.dumps({
              "http_status": status,
              "discord_code": payload.get("code"),
              "cf_ray": headers.get("cf-ray"),
              "retry_after": headers.get("retry-after"),
              "bot_authenticated": status == 200 and payload.get("bot") is True,
          }))
          if status != 200 or payload.get("bot") is not True:
              sys.exit(1)
          PY
